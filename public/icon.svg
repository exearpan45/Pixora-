<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pixora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pixora-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background with subtle dark border -->
  <rect width="512" height="512" rx="112" fill="#0b0f17" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1f293d" stroke-width="4" />
  
  <!-- Abstract Geometric 'P' from layered pixel frames -->
  <g transform="translate(136, 116)">
    <!-- Vertical stem / frame -->
    <rect x="0" y="0" width="76" height="280" rx="38" fill="url(#pixora-grad)" />
    <!-- Upper loop back piece -->
    <path d="M 60,0 L 160,0 C 215,0 248,34 248,84 C 248,134 215,168 160,168 L 60,168 Z" fill="url(#pixora-glow)" opacity="0.95" />
    <!-- Overlapping pixel aperture cut -->
    <circle cx="140" cy="84" r="38" fill="#0b0f17" />
  </g>
</svg>
